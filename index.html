
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선물 매매 통합 점검 대시보드</title>
    <!-- 안정적인 Tailwind CSS CDN v3 사용 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard 폰트 불러오기 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .checked-line {
            text-decoration: line-through;
            color: #94a3b8;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-5xl bg-white rounded-3xl p-6 md:p-10 shadow-xl border border-slate-100">
        <!-- 헤더 -->
        <header class="mb-8 border-b border-slate-100 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-slate-900">선물 매매 통합 점검 대시보드</h1>
                <p class="text-sm text-slate-500 mt-2 font-medium">실질 레버리지와 리스크 한도를 수학적으로 계산하여 감정 매매를 통제합니다.</p>
            </div>
            <!-- 전략 전환 탭 -->
            <div class="flex space-x-1.5 bg-slate-100 p-1 rounded-xl w-full md:w-auto">
                <button id="tab-day" onclick="switchStrategy('day')" class="flex-1 md:flex-none px-5 py-2 text-sm font-semibold rounded-lg bg-white text-slate-900 shadow-sm transition-all duration-200 cursor-pointer">
                    단타 (5분봉)
                </button>
                <button id="tab-swing" onclick="switchStrategy('swing')" class="flex-1 md:flex-none px-5 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 transition-all duration-200 cursor-pointer">
                    스윙 (1시간봉)
                </button>
            </div>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- 왼쪽: 데이터 입력 및 실시간 계산 영역 (7칸) -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- 1. 자금 및 자산 정보 입력 -->
                <div class="bg-slate-50/50 p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                    <h2 class="text-base font-bold text-slate-800 flex items-center">
                        <span class="w-1.5 h-4 bg-blue-600 rounded-full mr-2"></span>
                        1. 기본 거래 정보 입력
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- 총 예수금 -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5">내 계좌 총 예수금 (USD)</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-semibold text-sm">$</span>
                                <input type="number" id="input-balance" value="30000" oninput="calculate()" class="w-full pl-8 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-semibold text-sm">
                            </div>
                        </div>

                        <!-- 자산 유형 -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5">거래 종목 선택</label>
                            <select id="select-asset" onchange="onAssetChange()" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-semibold text-sm cursor-pointer">
                                <option value="MES" selected>마이크로 S&P 500 (MES)</option>
                                <option value="ES">S&P 500 (ES)</option>
                                <option value="M6E">마이크로 유로FX (M6E)</option>
                                <option value="6E">유로FX (6E)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 2. 포지션 세부 계획 -->
                <div class="bg-slate-50/50 p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-base font-bold text-slate-800 flex items-center">
                            <span class="w-1.5 h-4 bg-blue-600 rounded-full mr-2"></span>
                            2. 진입 및 청산 설계
                        </h2>
                        <button onclick="applyRecommendedPresets()" class="text-xs bg-slate-200/80 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-lg transition-colors cursor-pointer">
                            추천 타이트 프리셋 적용
                        </button>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <!-- 계약 수 -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5">진입 계약 수</label>
                            <input type="number" id="input-contracts" value="3" min="1" oninput="calculate()" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-bold text-sm">
                        </div>

                        <!-- 진입 가격 -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5">예정 진입 가격</label>
                            <input type="number" id="input-entry" value="5000" step="0.25" oninput="calculate()" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-bold text-sm">
                        </div>

                        <!-- 목표 익절가 -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5 text-emerald-600">목표 익절가</label>
                            <input type="number" id="input-profit" value="5012" step="0.25" oninput="calculate()" class="w-full px-3 py-2.5 bg-white border border-emerald-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-emerald-600 font-bold text-sm">
                        </div>

                        <!-- 손절 가격 -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5 text-rose-600">예정 손절가</label>
                            <input type="number" id="input-stop" value="4994" step="0.25" oninput="calculate()" class="w-full px-3 py-2.5 bg-white border border-rose-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-rose-500 text-rose-600 font-bold text-sm">
                        </div>
                    </div>
                </div>

                <!-- 3. 실시간 연산 분석 결과 -->
                <div class="bg-slate-900 text-white p-6 rounded-3xl shadow-lg space-y-6">
                    <h3 class="text-sm font-bold text-slate-400 tracking-wider uppercase">실시간 포지션 리스크 분석</h3>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                        <!-- 총 포지션 가치 -->
                        <div>
                            <div class="text-xs text-slate-400 font-medium mb-1">총 포지션 가치</div>
                            <div class="text-lg font-extrabold text-white" id="calc-position-value">$0.00</div>
                        </div>

                        <!-- 실질 레버리지 -->
                        <div>
                            <div class="text-xs text-slate-400 font-medium mb-1 flex items-center">
                                실질 레버리지
                                <span id="leverage-badge" class="ml-1.5 px-1.5 py-0.5 rounded text-[10px] font-black"></span>
                            </div>
                            <div class="text-lg font-extrabold text-white" id="calc-leverage">0.00배</div>
                        </div>

                        <!-- 예상 리스크 금액 -->
                        <div>
                            <div class="text-xs text-slate-400 font-medium mb-1 flex items-center">
                                예상 손절 손실
                                <span id="risk-badge" class="ml-1.5 px-1.5 py-0.5 rounded text-[10px] font-black"></span>
                            </div>
                            <div class="text-lg font-extrabold text-rose-400" id="calc-risk-amount">$0.00</div>
                        </div>

                        <!-- 예상 손익비 -->
                        <div>
                            <div class="text-xs text-slate-400 font-medium mb-1">예상 손익비</div>
                            <div class="text-lg font-extrabold text-emerald-400" id="calc-risk-reward">0.00 : 1</div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 오른쪽: 규칙 기반 시스템 검증 및 자율 체크리스트 (5칸) -->
            <div class="lg:col-span-5 space-y-6">
                
                <!-- 자율 원칙 점검 가이드라인 -->
                <div class="bg-slate-50/50 p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                    <div class="flex justify-between items-center pb-2 border-b border-slate-200/50">
                        <h2 class="text-base font-bold text-slate-800 flex items-center">
                            <span class="w-1.5 h-4 bg-slate-800 rounded-full mr-2"></span>
                            3. 타점 요건 시스템 확인
                        </h2>
                        <span id="system-status-badge" class="px-2 py-0.5 rounded text-xs font-bold bg-slate-200 text-slate-600">진입 대기</span>
                    </div>

                    <div class="space-y-2 text-xs md:text-sm text-slate-600 font-medium">
                        <div class="flex justify-between items-center p-3 bg-white rounded-xl border border-slate-100 shadow-xs">
                            <span>계좌 대비 총 리스크가 2% 이하인가?</span>
                            <span id="chk-risk-under-2" class="font-extrabold text-slate-400">대기</span>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-white rounded-xl border border-slate-100 shadow-xs">
                            <span>목표 레버리지 요건을 충족하는가?</span>
                            <span id="chk-leverage-fit" class="font-extrabold text-slate-400">대기</span>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-white rounded-xl border border-slate-100 shadow-xs">
                            <span>보상비율(손익비)이 1:1.5 이상인가?</span>
                            <span id="chk-rr-ratio" class="font-extrabold text-slate-400">대기</span>
                        </div>
                    </div>
                </div>

                <!-- 진입 전 체크리스트 -->
                <div class="bg-slate-50/50 p-6 rounded-2xl border border-slate-100 shadow-sm">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-200/50">
                        <h2 class="text-base font-bold text-slate-800 flex items-center">
                            <span class="w-1.5 h-4 bg-slate-800 rounded-full mr-2"></span>
                            4. 진입 직전 자율 서약
                        </h2>
                        <button onclick="resetChecklist()" class="text-xs text-blue-600 hover:text-blue-800 font-bold transition-colors cursor-pointer">체크 초기화</button>
                    </div>
                    <div class="space-y-3" id="checklist-container">
                        <label class="flex items-start p-3.5 rounded-xl bg-white hover:bg-slate-100/30 cursor-pointer transition-all border border-slate-200/40 shadow-xs">
                            <input type="checkbox" onchange="toggleCheck(this)" class="mt-1 mr-3 h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                            <span class="text-xs md:text-sm text-slate-600 font-semibold leading-relaxed">지금 자리가 본인이 수립한 진입 요건과 100% 일치합니까?</span>
                        </label>
                        <label class="flex items-start p-3.5 rounded-xl bg-white hover:bg-slate-100/30 cursor-pointer transition-all border border-slate-200/40 shadow-xs">
                            <input type="checkbox" onchange="toggleCheck(this)" class="mt-1 mr-3 h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                            <span class="text-xs md:text-sm text-slate-600 font-semibold leading-relaxed">30분 내 예정된 마크로 경제 지표 발표가 없습니까?</span>
                        </label>
                        <label class="flex items-start p-3.5 rounded-xl bg-white hover:bg-slate-100/30 cursor-pointer transition-all border border-slate-200/40 shadow-xs">
                            <input type="checkbox" onchange="toggleCheck(this)" class="mt-1 mr-3 h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                            <span class="text-xs md:text-sm text-slate-600 font-semibold leading-relaxed">손절 가격을 차트에 미리 대기 매도 설정해 두었습니까?</span>
                        </label>
                        <label class="flex items-start p-3.5 rounded-xl bg-white hover:bg-slate-100/30 cursor-pointer transition-all border border-slate-200/40 shadow-xs">
                            <input type="checkbox" onchange="toggleCheck(this)" class="mt-1 mr-3 h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                            <span class="text-xs md:text-sm text-slate-600 font-semibold leading-relaxed">손실을 만회하기 위한 충동적 추격 진입이 아닙니까?</span>
                        </label>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- 로직 스크립트 -->
    <script>
        let currentStrategy = 'day';

        const assetSpecs = {
            MES: { multiplier: 5, defaultPrice: 5000, tickSize: 0.25 },
            ES: { multiplier: 50, defaultPrice: 5000, tickSize: 0.25 },
            M6E: { multiplier: 12500, defaultPrice: 1.0850, tickSize: 0.00005 },
            '6E': { multiplier: 125000, defaultPrice: 1.0850, tickSize: 0.00005 }
        };

        function onAssetChange() {
            const asset = document.getElementById('select-asset').value;
            const spec = assetSpecs[asset];
            
            document.getElementById('input-entry').value = spec.defaultPrice;
            document.getElementById('input-entry').step = spec.tickSize;
            document.getElementById('input-profit').step = spec.tickSize;
            document.getElementById('input-stop').step = spec.tickSize;

            applyRecommendedPresets();
        }

        function switchStrategy(type) {
            currentStrategy = type;
            const isDay = type === 'day';
            
            document.getElementById('tab-day').className = `flex-1 md:flex-none px-5 py-2 text-sm font-semibold rounded-lg ${isDay ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'} transition-all duration-200 cursor-pointer`;
            document.getElementById('tab-swing').className = `flex-1 md:flex-none px-5 py-2 text-sm font-semibold rounded-lg ${!isDay ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'} transition-all duration-200 cursor-pointer`;

            applyRecommendedPresets();
        }

        function applyRecommendedPresets() {
            const asset = document.getElementById('select-asset').value;
            const entryVal = parseFloat(document.getElementById('input-entry').value) || 0;
            
            let stopDiff = 0;
            let profitDiff = 0;

            if (asset === 'MES' || asset === 'ES') {
                if (currentStrategy === 'day') {
                    stopDiff = 6;
                    profitDiff = 12;
                } else {
                    stopDiff = 22;
                    profitDiff = 45;
                }
                
                document.getElementById('input-stop').value = (entryVal - stopDiff).toFixed(2);
                document.getElementById('input-profit').value = (entryVal + profitDiff).toFixed(2);
            } else if (asset === 'M6E' || asset === '6E') {
                if (currentStrategy === 'day') {
                    stopDiff = 0.00125;
                    profitDiff = 0.00250;
                } else {
                    stopDiff = 0.00225;
                    profitDiff = 0.00450;
                }

                document.getElementById('input-stop').value = (entryVal - stopDiff).toFixed(5);
                document.getElementById('input-profit').value = (entryVal + profitDiff).toFixed(5);
            }

            calculate();
        }

        function calculate() {
            const balance = parseFloat(document.getElementById('input-balance').value) || 0;
            const asset = document.getElementById('select-asset').value;
            const contracts = parseInt(document.getElementById('input-contracts').value) || 0;
            const entry = parseFloat(document.getElementById('input-entry').value) || 0;
            const profit = parseFloat(document.getElementById('input-profit').value) || 0;
            const stop = parseFloat(document.getElementById('input-stop').value) || 0;

            const spec = assetSpecs[asset];

            // 1. 총 포지션 가치 계산
            const positionValue = entry * spec.multiplier * contracts;
            document.getElementById('calc-position-value').innerText = `$${positionValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            // 2. 실질 레버리지 계산
            const leverage = balance > 0 ? positionValue / balance : 0;
            document.getElementById('calc-leverage').innerText = `${leverage.toFixed(2)}배`;

            const maxAllowedLeverage = currentStrategy === 'day' ? 5 : 2;
            const levBadge = document.getElementById('leverage-badge');
            
            if (leverage === 0) {
                levBadge.className = 'hidden';
            } else if (leverage <= maxAllowedLeverage) {
                levBadge.className = 'ml-1.5 px-1.5 py-0.5 rounded text-[10px] font-black bg-emerald-500/20 text-emerald-400';
                levBadge.innerText = '안전';
                document.getElementById('chk-leverage-fit').className = 'font-extrabold text-emerald-500';
                document.getElementById('chk-leverage-fit').innerText = '충족';
            } else if (leverage <= maxAllowedLeverage * 1.5) {
                levBadge.className = 'ml-1.5 px-1.5 py-0.5 rounded text-[10px] font-black bg-amber-500/20 text-amber-400';
                levBadge.innerText = '경계';
                document.getElementById('chk-leverage-fit').className = 'font-extrabold text-amber-500';
                document.getElementById('chk-leverage-fit').innerText = '주의';
            } else {
                levBadge.className = 'ml-1.5 px-1.5 py-0.5 rounded text-[10px] font-black bg-rose-500/20 text-rose-400';
                levBadge.innerText = '위험';
                document.getElementById('chk-leverage-fit').className = 'font-extrabold text-rose-500';
                document.getElementById('chk-leverage-fit').innerText = '초과';
            }

            // 3. 예상 리스크 금액 계산
            const stopDifference = Math.abs(entry - stop);
            const totalRisk = stopDifference * spec.multiplier * contracts;
            document.getElementById('calc-risk-amount').innerText = `$${totalRisk.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            const riskRatio = balance > 0 ? (totalRisk / balance) * 100 : 0;
            const riskBadge = document.getElementById('risk-badge');

            if (riskRatio === 0) {
                riskBadge.className = 'hidden';
            } else if (riskRatio <= 2.0) {
                riskBadge.className = 'ml-1.5 px-1.5 py-0.5 rounded text-[10px] font-black bg-emerald-500/20 text-emerald-400';
                riskBadge.innerText = `${riskRatio.toFixed(1)}% 안전`;
                document.getElementById('chk-risk-under-2').className = 'font-extrabold text-emerald-500';
                document.getElementById('chk-risk-under-2').innerText = '안전';
            } else if (riskRatio <= 4.0) {
                riskBadge.className = 'ml-1.5 px-1.5 py-0.5 rounded text-[10px] font-black bg-amber-500/20 text-amber-400';
                riskBadge.innerText = `${riskRatio.toFixed(1)}% 경계`;
                document.getElementById('chk-risk-under-2').className = 'font-extrabold text-amber-500';
                document.getElementById('chk-risk-under-2').innerText = '경계';
            } else {
                riskBadge.className = 'ml-1.5 px-1.5 py-0.5 rounded text-[10px] font-black bg-rose-500/20 text-rose-400';
                riskBadge.innerText = `${riskRatio.toFixed(1)}% 초과`;
                document.getElementById('chk-risk-under-2').className = 'font-extrabold text-rose-500';
                document.getElementById('chk-risk-under-2').innerText = '위험';
            }

            // 4. 예상 손익비 계산
            const profitDifference = Math.abs(entry - profit);
            const riskRewardRatio = stopDifference > 0 ? (profitDifference / stopDifference) : 0;
            document.getElementById('calc-risk-reward').innerText = `1 : ${riskRewardRatio.toFixed(1)}`;

            if (riskRewardRatio >= 1.5) {
                document.getElementById('chk-rr-ratio').className = 'font-extrabold text-emerald-500';
                document.getElementById('chk-rr-ratio').innerText = '합격';
            } else {
                document.getElementById('chk-rr-ratio').className = 'font-extrabold text-rose-500';
                document.getElementById('chk-rr-ratio').innerText = '불합격';
            }

            const statusBadge = document.getElementById('system-status-badge');
            if (leverage <= maxAllowedLeverage && riskRatio <= 2.0 && riskRewardRatio >= 1.5) {
                statusBadge.className = 'px-2 py-0.5 rounded text-xs font-bold bg-emerald-100 text-emerald-700';
                statusBadge.innerText = '승인 완료';
            } else if (leverage > maxAllowedLeverage * 1.5 || riskRatio > 4.0 || riskRewardRatio < 1.0) {
                statusBadge.className = 'px-2 py-0.5 rounded text-xs font-bold bg-rose-100 text-rose-700';
                statusBadge.innerText = '진입 금지';
            } else {
                statusBadge.className = 'px-2 py-0.5 rounded text-xs font-bold bg-amber-100 text-amber-700';
                statusBadge.innerText = '보수적 타진';
            }
        }

        function toggleCheck(checkbox) {
            const textSpan = checkbox.nextElementSibling;
            if (checkbox.checked) {
                textSpan.classList.add('checked-line');
            } else {
                textSpan.classList.remove('checked-line');
            }
        }

        function resetChecklist() {
            const checkboxes = document.querySelectorAll('#checklist-container input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = false;
                cb.nextElementSibling.classList.remove('checked-line');
            });
        }

        // 지연 로드 방지를 위한 즉각적인 실행 흐름 정의
        onAssetChange();
    </script>
</body>
</html>
